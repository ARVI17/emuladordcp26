name: emuladordcp26
services:
  database:
    container_name: emuladordcp26-database
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-64MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-30}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-2MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-32MB}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fc26}
      POSTGRES_USER: ${POSTGRES_USER:-fc26}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fc26_local_change_me}
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fc26} -d ${POSTGRES_DB:-fc26}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: ${DATABASE_MEMORY_LIMIT:-256m}
    networks: [internal]

  backend:
    container_name: emuladordcp26-backend
    build:
      context: ./backend
      args: &build_metadata
        BUILD_REVISION: ${BUILD_REVISION:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        BUILD_ENVIRONMENT: ${BUILD_ENVIRONMENT:-local}
        BUILD_DIRTY: ${BUILD_DIRTY:-false}
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_DB: ${POSTGRES_DB:-fc26}
      POSTGRES_USER: ${POSTGRES_USER:-fc26}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fc26_local_change_me}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-3}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-2}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-2m}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${APP_PORT:-8080},http://127.0.0.1:${APP_PORT:-8080}}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      ASSISTED_DRAFT_RETENTION_MINUTES: ${ASSISTED_DRAFT_RETENTION_MINUTES:-30}
      ADB_ENABLED: ${ADB_ENABLED:-false}
      ADB_DEFAULT_ADDRESS: ${ADB_DEFAULT_ADDRESS:-host.docker.internal:5555}
      ADB_SERVER_SOCKET: ${ADB_SERVER_SOCKET:-tcp:host.docker.internal:5037}
      SEED_DEMO: ${SEED_DEMO:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    mem_limit: ${BACKEND_MEMORY_LIMIT:-512m}
    networks: [internal]

  frontend:
    container_name: emuladordcp26-frontend
    build:
      context: ./frontend
      args:
        <<: *build_metadata
        VITE_API_URL: ${VITE_API_URL:-/api}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-64m}
    networks: [internal]

  frontend-test:
    build:
      context: ./frontend
      target: build
    profiles: [test]
    command: npm test -- --run
    networks: [internal]

  frontend-e2e:
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    profiles: [test]
    environment:
      PLAYWRIGHT_BASE_URL: http://nginx
    depends_on:
      nginx:
        condition: service_healthy
    networks: [internal]

  nginx:
    container_name: emuladordcp26-nginx
    image: nginx:1.27-alpine
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: ${NGINX_MEMORY_LIMIT:-64m}
    networks: [internal]

  ollama:
    container_name: emuladordcp26-ollama
    image: ollama/ollama:latest
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-2m}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_NO_CLOUD: ${OLLAMA_NO_CLOUD:-1}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-3g}
    networks: [internal]

volumes:
  postgres_data:
    name: emuladordcp26_postgres_data
  ollama_data:
    name: emuladordcp26_ollama_data

networks:
  internal:
    name: emuladordcp26_internal
