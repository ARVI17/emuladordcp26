# Disposable, isolated verification stack. Does not use the normal project's volumes.
name: emuladordcp26-planner-review
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: planner_review_test
      POSTGRES_USER: planner_test
      POSTGRES_PASSWORD: planner_test_only
    tmpfs: [/var/lib/postgresql/data]
    mem_limit: 256m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U planner_test -d planner_review_test"]
      interval: 3s
      timeout: 3s
      retries: 30
  backend:
    image: ${VERIFY_BACKEND_IMAGE:-emuladordcp26-planner-backend}
    build:
      context: ./backend
      args: &build_metadata
        BUILD_REVISION: ${BUILD_REVISION:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        BUILD_ENVIRONMENT: ${BUILD_ENVIRONMENT:-review}
        BUILD_DIRTY: ${BUILD_DIRTY:-false}
    environment:
      DATABASE_URL: postgresql+psycopg://planner_test:planner_test_only@database:5432/planner_review_test
      OLLAMA_URL: http://127.0.0.1:1
      ADB_ENABLED: 'false'
      SEED_DEMO: 'false'
      CORS_ORIGINS: http://localhost:${REVIEW_PORT:-8081},http://127.0.0.1:${REVIEW_PORT:-8081}
    depends_on:
      database:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
  frontend:
    build:
      context: ./frontend
      args: *build_metadata
    mem_limit: 64m
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
  nginx:
    image: nginx:1.27-alpine
    ports: ['127.0.0.1:${REVIEW_PORT:-8081}:80']
    volumes: [./nginx/nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    mem_limit: 64m
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend-e2e:
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    profiles: [test]
    environment:
      PLAYWRIGHT_BASE_URL: http://nginx
      PLAYWRIGHT_DISPOSABLE_DB: '1'
    volumes: [./frontend/test-results:/app/test-results]
    depends_on:
      nginx:
        condition: service_healthy
