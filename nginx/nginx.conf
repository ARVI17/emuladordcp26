events { worker_connections 1024; }
http {
  server_tokens off;
  client_max_body_size 12m;
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream api { zone api_backend 64k; server backend:8000 resolve; }
  upstream web { zone web_frontend 64k; server frontend:80 resolve; }
  server {
    listen 80;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; script-src 'self'" always;
    location = /health { proxy_pass http://api/health; }
    location /api/ { proxy_pass http://api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location / { proxy_pass http://web; proxy_set_header Host $host; }
  }
}
